services:
  public-quota-redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: moneyworry-public-quota-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /etc/moneyworry/public-quota-redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /etc/moneyworry/public-quota-users.acl:/usr/local/etc/redis/users.acl:ro
      - /srv/moneyworry/public-quota-redis:/data
