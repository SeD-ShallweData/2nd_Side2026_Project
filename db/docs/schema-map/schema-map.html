<text x="417" y="822.5" font-size="9.4" font-weight="600" fill="#6B7899">점선 = 식별관계 — 부모 키가 자식 PK 의 일부 (PK,FK)</text><rect x="390" y="837" width="20" height="12" rx="3" fill="#3B5BDB"/><text x="417" y="846.5" font-size="9.4" font-weight="600" fill="#6B7899">파랑 = 서비스 운영 데이터 (A) · 진한 색 = 각 영역의 기준 축</text><rect x="390" y="861" width="20" height="12" rx="3" fill="#F0A02A"/><text x="417" y="870.5" font-size="9.4" font-weight="600" fill="#6B7899">노랑 = 머신러닝 파이프라인 (B · C)</text><rect x="672" y="813" width="20" height="12" rx="3" fill="#2E9E68"/><text x="699" y="822.5" font-size="9.4" font-weight="600" fill="#6B7899">초록 = 돈워리 AI RAG 경로 (D)</text><rect x="672" y="837" width="20" height="12" rx="3" fill="#fff"/><text x="699" y="846.5" font-size="9.4" font-weight="600" fill="#6B7899">테이블 아님 — 런타임 흐름 / 외부 서비스</text><circle cx="682" cy="867" r="4.2" fill="#fff" stroke="#F0A02A" stroke-width="1.7"/><text x="699" y="870.5" font-size="9.4" font-weight="600" fill="#6B7899">NULL 허용 FK · ON DELETE SET NULL</text><text x="952" y="822" font-size="10.5" font-weight="900" fill="#1C2A54">읽을 때 주의</text><text x="952" y="837" font-size="9.4" font-weight="600" fill="#6B7899">· ML 파이프라인은 둘이다 — B는 batches(월 배치) 축 · 사업장 단위, C는 pipeline_runs 축 · 지역·업종 셀 × 주 → 사업장 스냅샷 단위.</text><text x="952" y="852" font-size="9.4" font-weight="600" fill="#6B7899">· B의 3개 테이블은 (firm_id, batch_id) 복합 PK — 사업장당 1행이 아니라 배치마다 1행. firms 삭제 시 CASCADE.</text><text x="952" y="867" font-size="9.4" font-weight="600" fill="#6B7899">· D(돈워리 AI)는 저장 테이블이 없다 — 임베딩 인덱스는 외부 RAG 서버에 있고, DB 에서는 firms · scored_active 를 읽기만 한다.</text><text x="952" y="882" font-size="9.4" font-weight="600" fill="#6B7899">· 구조도에 없는 8개: user_favorite_firms(즐겨찾기) · conversation_* 7개(상담 기록) — 전체 34개 목록은 db/docs/SCHEMA_MAP.md</text></svg></div></body></html>
