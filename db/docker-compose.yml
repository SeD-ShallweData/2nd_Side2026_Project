# 돈워리 로컬 DB.
#
# 이 서버는 사용자가 9명이고 Docker 컨테이너·볼륨·포트는 머신 전역이다.
# 그래서 프로젝트 접두사(COMPOSE_PROJECT_NAME)와 호스트 포트(DB_PORT)를
# .env.local 에서 각자 다르게 잡는다. 그러면 같은 파일로 여러 사람이 동시에 띄울 수 있다.
#
#   cd infra && docker compose --env-file ../.env.local up -d
name: ${COMPOSE_PROJECT_NAME:-wageguard}

services:
  db:
    # Multi-architecture OCI index pinned on 2026-08-26. Update deliberately
    # after PG16 restore rehearsal; a moving tag must not alter a release rebuild.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # Docker 기본 /dev/shm 은 64MB 다. Postgres 의 병렬 워커(VACUUM·인덱스 빌드·해시 조인)가
    # 여기에 공유메모리를 잡는데, 수백만 행 규모에서는 64MB 로 부족해 이렇게 실패한다:
    #   ERROR: could not resize shared memory segment ... No space left on device
    # 디스크가 아니라 /dev/shm 이 꽉 찬 것이다. 메시지가 헷갈리게 나온다.
    shm_size: 1gb
    # 127.0.0.1 로 묶는다 — 공용 머신이라 사내망에 DB 를 열지 않는다.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-wageguard}
      POSTGRES_USER: ${DB_USER:-wageguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env.local 에 DB_PASSWORD 를 설정하세요}
      # Path B 정본 계약과 동일한 libc locale을 쓴다. 정렬은 SQL의 명시적
      # COLLATE "C"로 고정하며, Alpine에 없는 ko_KR/ICU를 암묵 사용하지 않는다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=libc --lc-collate=C --lc-ctype=C.UTF-8"
    volumes:
      # 로컬 기본값은 named volume이다. GCP VM에서는 POSTGRES_DATA_DIR을
      # /srv/moneyworry/postgres처럼 별도 Persistent Disk의 절대경로로 둔다.
      - "${POSTGRES_DATA_DIR:-pgdata}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wageguard} -d ${DB_NAME:-wageguard}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # named volume — repo 안에 바인드 마운트하면 컨테이너의 postgres(uid 999)와
  # 권한이 꼬이고 git clean 한 번에 날아간다.
  pgdata:
