name: Database and Contract CI

on:
  pull_request:
    paths:
      - "db/**"
      - "infra/**"
      - "product/integrations/contract-api/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "infra/**"
      - "product/integrations/contract-api/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migration-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wageguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wageguard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wageguard_ci
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: db/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - run: npm ci
      - run: npm run test:migration-drift
      - run: npm run test:ingest-cli
      - run: PATH_B_TEST_PYTHON="$pythonLocation/bin/python3" npm run test:path-b-static
      - run: npm run migrate
      - run: npm run check:migration-drift

  contract-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: product/integrations/contract-api/requirements.lock
      - run: python -m pip install --require-hashes -r product/integrations/contract-api/requirements.lock
      - run: python -m compileall -q product/integrations/contract-api/app
      - run: python -m unittest discover -s product/integrations/contract-api/tests -p 'test_*.py'
      - run: bash -n infra/scripts/install-systemd-units.sh
      - run: python -m unittest discover -s infra/tests -p 'test_*.py'
      - name: Validate GCP automation syntax
        run: |
          bash -n \
            infra/gcp/common.sh \
            infra/gcp/preflight.sh \
            infra/gcp/provision.sh \
            infra/gcp/tests/fake-gcloud.sh \
            infra/gcp/tests/test-gcp-automation.sh
          python -m py_compile infra/gcp/validate-preflight.py
      - name: Test fail-closed GCP automation with fake gcloud
        run: infra/gcp/tests/test-gcp-automation.sh
