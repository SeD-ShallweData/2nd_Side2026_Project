name: Product CI

on:
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
      # 저장소 루트의 비밀값 검사기·훅·.gitignore 테스트도 product 테스트에 들어 있다.
      # 경로 필터는 워크플로 단위라 이 파일들만 바꿔도 rag-quality 잡까지 돈다.
      - "scripts/scan-secrets.mjs"
      - ".githooks/**"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
      - "scripts/scan-secrets.mjs"
      - ".githooks/**"
      - ".gitignore"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # 빌드 산출물 검사용 가짜 비밀값 표식. 앱 코드는 이 이름을 읽지 않는다.
      SECRET_CANARY: ci-canary-6d0f1c2a
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: product/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (가짜 비밀값 주입)
        env:
          # 표식이 든 가짜 값을 넣고 빌드해, 값이 브라우저로 가는 산출물에 섞이는지 아래 단계에서 본다.
          # 아래 이름의 값이 next.config 의 env·compiler.define 등으로 번들에 들어가면 여기서 드러난다.
          # 새 NEXT_PUBLIC_ 변수는 CI 가 값을 넣지 않아 여기서 잡히지 않는다. 그 길은 clientSecretBoundary.test.ts 가 막는다.
          UPSTAGE_API_KEY: ${{ env.SECRET_CANARY }}-upstage
          SKT_API_KEY: ${{ env.SECRET_CANARY }}-skt
          OPENAI_API_KEY: ${{ env.SECRET_CANARY }}-openai
          RAG_INTERNAL_TOKEN: ${{ env.SECRET_CANARY }}-rag
          CONTRACT_INTERNAL_TOKEN: ${{ env.SECRET_CANARY }}-contract
          PUBLIC_RATE_LIMIT_PROXY_TOKEN: ${{ env.SECRET_CANARY }}-proxy
          DEMO_BASIC_AUTH_PASSWORD: ${{ env.SECRET_CANARY }}-basic
          # 앱이 읽는 DB 연결 문자열 전부(src/server/databaseConfig.ts)
          DATABASE_URL: postgresql://wageguard:${{ env.SECRET_CANARY }}-owner@127.0.0.1:9/wageguard
          BOT_DATABASE_URL: postgresql://wg_bot:${{ env.SECRET_CANARY }}-bot@127.0.0.1:9/wageguard
          AUTH_DATABASE_URL: postgresql://wg_auth:${{ env.SECRET_CANARY }}-auth@127.0.0.1:9/wageguard
          COMMUNITY_DATABASE_URL: postgresql://wg_community:${{ env.SECRET_CANARY }}-community@127.0.0.1:9/wageguard
          TIP_DATABASE_URL: postgresql://wg_tip:${{ env.SECRET_CANARY }}-tip@127.0.0.1:9/wageguard
          CONVERSATION_DATABASE_URL: postgresql://wg_conversation:${{ env.SECRET_CANARY }}-conversation@127.0.0.1:9/wageguard
          OPS_DATABASE_URL: postgresql://wg_ops:${{ env.SECRET_CANARY }}-ops@127.0.0.1:9/wageguard
          PUBLIC_RATE_LIMIT_REDIS_URL: redis://:${{ env.SECRET_CANARY }}-redis@127.0.0.1:9/0
          # 혹시 모를 외부 호출은 닿지 않는 주소로 막는다.
          UPSTAGE_API_URL: http://127.0.0.1:9/
          SKT_API_URL: http://127.0.0.1:9/
          OPENAI_RESPONSES_API_URL: http://127.0.0.1:9/
        run: npm run build
      - name: 브라우저로 가는 빌드 산출물의 비밀값 검사
        # 값은 앞부분과 길이만 출력한다. 배포(deploy-from-git.sh)가 npm run build 를 돌리므로
        # 오탐이 나도 배포가 멈추지 않게 build·postbuild 스크립트가 아닌 CI 에만 둔다.
        # .body 는 정적 route handler(robots.txt, sitemap 등)의 응답 본문이다. 이미지 같은 바이너리는 건너뛴다.
        run: |
          node ../scripts/scan-secrets.mjs --dir .next/static --canary "$SECRET_CANARY"
          node ../scripts/scan-secrets.mjs --dir .next/server/app --ext html,rsc,body --canary "$SECRET_CANARY"

  rag-quality:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/product/integrations/rag-api/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/product/integrations/rag-api/.cache/huggingface/hub
    defaults:
      run:
        working-directory: product/integrations/rag-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: product/integrations/rag-api/requirements.lock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: product/integrations/rag-api/.cache/huggingface
          key: ${{ runner.os }}-bge-m3-${{ hashFiles('product/integrations/rag-api/config/rag_assets.v1.json') }}
      - name: Install and attest CPU-only hashed runtime
        run: |
          python -m venv .venv
          RAG_TORCH_WHEELHOUSE="$RUNNER_TEMP/rag-torch-wheelhouse"
          install -d -m 0700 "$RAG_TORCH_WHEELHOUSE"
          .venv/bin/python -m pip --isolated download \
            --no-deps \
            --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            --dest "$RAG_TORCH_WHEELHOUSE" \
            'torch==2.13.0+cpu'
          RAG_TORCH_WHEEL="$RAG_TORCH_WHEELHOUSE/torch-2.13.0+cpu-cp312-cp312-manylinux_2_28_x86_64.whl"
          test "$(sha256sum -- "$RAG_TORCH_WHEEL" | cut -d ' ' -f 1)" = \
            "4ca4a9394b0c771238a4f73590fdbbc4debad85ed0fa63d026ae1b085da7d6e2"

          .venv/bin/python -m pip --isolated install \
            --only-binary=:all: \
            --require-hashes -r requirements.lock \
            --index-url https://pypi.org/simple \
            --find-links "$RAG_TORCH_WHEELHOUSE"

          RAG_SETUPTOOLS_PTH="$PWD/.venv/lib/python3.12/site-packages/distutils-precedence.pth"
          test "$(sha256sum -- "$RAG_SETUPTOOLS_PTH" | cut -d ' ' -f 1)" = \
            "2638ce9e2500e572a5e0de7faed6661eb569d1b696fcba07b0dd223da5f5d224"
          unlink -- "$RAG_SETUPTOOLS_PTH"

          .venv/bin/python -m pip check
          .venv/bin/python -I - <<'PY'
          import chromadb
          import importlib.metadata
          import re
          import sentence_transformers
          import torch

          forbidden = sorted(
              distribution.metadata["Name"]
              for distribution in importlib.metadata.distributions()
              if re.match(
                  r"(?i)^(?:cuda|nvidia)|^triton$",
                  distribution.metadata.get("Name") or "",
              )
          )
          assert not forbidden, forbidden
          assert torch.__version__ == "2.13.0+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.backends.cuda.is_built()
          assert not torch.cuda.is_available()
          assert chromadb.__version__ == "1.5.9", chromadb.__version__
          assert sentence_transformers.__version__ == "5.6.1", sentence_transformers.__version__
          PY
          python -I -S ../../../infra/scripts/verify-python-runtime.py \
            --venv "$PWD/.venv" \
            --python "$PWD/.venv/bin/python" \
            --lock "$PWD/requirements.lock"
      - run: .venv/bin/python -m unittest test_retriever.py test_asset_manifest.py test_app.py
      - name: Prepare exact pinned model snapshot
        run: |
          .venv/bin/python prepare_rag_assets.py prepare \
            --manifest "$PWD/config/rag_assets.v1.json" \
            --hf-home "$HF_HOME" \
            --hub-cache "$HF_HUB_CACHE" \
            --rag-db "$PWD/data/labor_law_db" \
            --confirm PREPARE_BAAI_BGE_M3_5617A9F6
      - name: Evaluate with network-disabled model resolution
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: .venv/bin/python eval/run_product_eval.py
