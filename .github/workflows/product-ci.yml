name: Product CI

on:
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
  push:
    branches: [main]
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rag-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/integrations/rag-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/integrations/rag-api/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-bge-m3-${{ hashFiles('product/integrations/rag-api/requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: python -m unittest test_retriever.py
      - run: python eval/run_product_eval.py
