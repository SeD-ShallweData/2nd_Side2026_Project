name: Secret scan

# 경로 필터 없이 모든 PR 과 main push 에서 돈다. 공개 저장소라 push 되는 순간 노출되므로
# 이 검사는 사후 탐지다. push 전에 막으려면 .githooks/pre-push 를 켠다(product/README.md 의 검증 명령 참고).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 은 같은 PR 의 이전 실행을 취소하고, main push 는 실행마다 그룹을 따로 둔다.
  # GitHub 는 한 그룹에 대기 실행을 하나만 남기므로, 그룹을 같이 쓰면 연달아 들어온 push 의 커밋별 검사가 빠진다.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 커밋을 하나씩 보려면 기준 브랜치까지의 이력이 필요하다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: PR 이 새로 넣은 줄 검사
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/scan-secrets.mjs --diff "origin/$BASE_REF"
      - name: main 에 push 된 커밋 검사
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/scan-secrets.mjs --diff "$BEFORE"
          else
            echo "이전 커밋을 찾지 못해 커밋별 검사는 건너뛰고 아래 전체 검사만 합니다."
          fi
      - name: 추적 파일 전체 검사
        run: node scripts/scan-secrets.mjs --all
